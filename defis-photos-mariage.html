<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Défis Photos Mariage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>

    --cream:#faf5ec; --paper:#fdfbf4; --ink:#3a342b; --rose:#c98a7d; --rose-d:#b06b5d;
    --gold:#bfa15a; --green:#6f7d5e; --line:#d8e6f2; --margin:#e7a8a0; --shadow:0 8px 24px rgba(80,60,40,.14);
    --dark:#1f2530; --dark2:#2a3140; --dark3:#353d4f; --dlight:#e7ebf2; --accent:#7fb3a3;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:'Playfair Display',Georgia,serif;background:var(--cream);color:var(--ink);overflow-x:hidden}
  #screen{min-height:100vh;display:flex;flex-direction:column}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .hand{font-family:'Caveat',cursive}

  /* ---------- JOIN ---------- */
  .join{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:42px 26px;
    background:radial-gradient(circle at 50% 18%,#fff8ee,var(--cream))}
  .join .deco{font-size:34px;letter-spacing:6px;color:var(--gold);opacity:.8;margin-bottom:14px}
  .join h1{font-size:13px;letter-spacing:5px;text-transform:uppercase;color:var(--rose-d);font-weight:500;margin-bottom:8px}
  .join .names{font-size:46px;line-height:1.15;color:var(--ink);margin:6px 0 4px;font-weight:600}
  .join .sub{font-size:18px;color:#857c6c;font-style:italic;max-width:330px;margin:14px auto 30px}
  .join .field{width:100%;max-width:320px}
  .join input{width:100%;padding:15px 18px;border:1.5px solid #e3d8c5;border-radius:14px;background:#fff;font-size:17px;
    font-family:inherit;text-align:center;color:var(--ink)}
  .join input:focus{outline:none;border-color:var(--rose)}
  .cta{width:100%;max-width:320px;margin-top:14px;padding:15px;border-radius:14px;background:var(--rose);color:#fff;
    font-size:17px;font-weight:600;letter-spacing:.5px;box-shadow:0 6px 16px rgba(201,138,125,.4)}
  .cta:active{transform:scale(.98)}

  /* ---------- HEADER ---------- */
  header{position:sticky;top:0;z-index:30;background:rgba(250,245,236,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid #ece2d0;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .hnames{font-size:20px;font-weight:600;color:var(--ink);line-height:1;cursor:pointer;user-select:none;flex:1;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .htimer{font-size:13px;color:var(--rose-d);font-weight:600;background:#fbe9e5;padding:5px 10px;border-radius:20px;white-space:nowrap}
  .htimer.off{background:#eee7d8;color:#998c72}
  .hscore{font-size:14px;font-weight:700;color:#fff;background:var(--green);padding:6px 11px;border-radius:20px;white-space:nowrap}

  main{flex:1;padding:18px 16px 96px}
  .phasebanner{text-align:center;font-style:italic;color:#998c72;font-size:14px;background:#f3ebd9;
    border-radius:12px;padding:10px;margin-bottom:16px;line-height:1.35}

  /* ---------- CARNET ---------- */
  .notebook{background:var(--paper);border-radius:10px;box-shadow:var(--shadow);padding:26px 20px 30px 46px;position:relative;
    background-image:repeating-linear-gradient(transparent,transparent 37px,#e9f0f7 37px,#e9f0f7 38px);overflow:hidden}
  .notebook:before{content:"";position:absolute;top:0;bottom:0;left:30px;width:2px;background:var(--margin);opacity:.55}
  .nb-title{font-family:'Caveat',cursive;font-size:34px;color:#46627d;margin-bottom:10px;line-height:1.2}
  .nb-sub{font-family:'Caveat',cursive;font-size:19px;color:#8a8270;margin-bottom:18px}
  .task{display:flex;align-items:flex-start;gap:12px;padding:7px 0;min-height:38px;line-height:38px}
  .check{flex:none;width:26px;height:26px;border:2px solid #b9c6d3;border-radius:7px;margin-top:6px;display:flex;
    align-items:center;justify-content:center;font-size:18px;color:#fff;transition:.2s}
  .task.done .check{background:var(--green);border-color:var(--green)}
  .task .txt{font-family:'Caveat',cursive;font-size:23px;color:#3a342b;flex:1;cursor:pointer}
  .task.done .txt{color:#9aa08f;text-decoration:line-through;text-decoration-color:#bcc3b1;cursor:default}
  .task.locked .txt{cursor:default}
  .pts{font-family:'Playfair Display',serif;font-size:12px;font-weight:700;color:#fff;border-radius:20px;padding:3px 9px;
    margin-top:9px;flex:none;line-height:1}
  .p2{background:#9bb07f}.p5{background:#6f9ec4}.p7{background:#c79a5b}.p10{background:#c0728a}
  .polaroid{margin:4px 0 10px 38px;background:#fff;padding:8px 8px 26px;border-radius:3px;box-shadow:0 6px 14px rgba(0,0,0,.18);
    width:138px;transform:rotate(-2.5deg);position:relative}
  .polaroid:nth-child(even){transform:rotate(2deg)}
  .polaroid img{width:122px;height:122px;object-fit:cover;display:block;border-radius:2px}
  .polaroid:after{content:"";position:absolute;top:-9px;left:42px;width:54px;height:18px;background:rgba(214,228,238,.7);
    transform:rotate(-4deg);box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .nb-hint{font-family:'Caveat',cursive;font-size:18px;color:#a59a85;margin-top:22px;text-align:center;line-height:1.3}

  /* ---------- VOTE (Tinder) ---------- */
  .voteWrap{display:flex;flex-direction:column;align-items:center}
  .vintro{font-style:italic;color:#998c72;text-align:center;margin-bottom:16px;font-size:14px}
  .stack{position:relative;width:100%;max-width:340px;height:460px;margin:0 auto}
  .card{position:absolute;inset:0;background:#fff;border-radius:20px;box-shadow:0 14px 34px rgba(60,45,30,.22);overflow:hidden;
    display:flex;flex-direction:column;transition:transform .3s ease,opacity .3s ease}
  .card.flyout{transform:translateY(-40px) rotate(-6deg) scale(.94);opacity:0}
  .card.behind{transform:scale(.94) translateY(14px);box-shadow:0 8px 20px rgba(60,45,30,.12)}
  .card .photo{flex:1;background:#eee;background-size:cover;background-position:center}
  .card .clabel{position:absolute;top:14px;left:14px;right:14px;background:rgba(31,37,48,.78);color:#fff;font-size:14px;
    padding:9px 13px;border-radius:12px;line-height:1.25;backdrop-filter:blur(4px)}
  .card .clabel b{font-family:'Caveat',cursive;font-size:13px;display:block;color:#ffd9b0;letter-spacing:1px;text-transform:uppercase;font-weight:700}
  .rateBar{padding:16px 14px 18px;text-align:center;background:#fff}
  .rateBar .q{font-style:italic;color:#8a8270;font-size:14px;margin-bottom:8px}
  .stars{display:flex;justify-content:center;gap:8px}
  .stars span{font-size:36px;color:#dcd3c2;transition:.12s;line-height:1}
  .stars span:active{transform:scale(1.25)}
  .vdone{text-align:center;padding:50px 24px;color:#998c72}
  .vdone .big{font-size:54px;margin-bottom:12px}
  .vcount{margin-top:16px;font-size:13px;color:#b3a892;text-align:center}

  /* ---------- PALMARÈS ---------- */
  .sectitle{font-size:22px;font-weight:600;text-align:center;margin:6px 0 18px;color:var(--ink)}
  .podwrap{margin:10px 0 26px;position:relative}
  .podwrap:before{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);width:140px;height:140px;
    background:radial-gradient(circle,rgba(191,161,90,.16),transparent 70%);pointer-events:none}
  .podium{display:flex;align-items:flex-end;justify-content:center;gap:12px;position:relative}
  .pod{flex:1;max-width:114px;text-align:center;position:relative}
  .pod .crown{font-size:26px;line-height:1;margin-bottom:4px;filter:drop-shadow(0 3px 4px rgba(191,161,90,.45))}
  .pod .ring{width:64px;height:64px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;
    font-family:'Caveat',cursive;font-size:30px;font-weight:700;color:#fff;position:relative;border:3px solid rgba(255,255,255,.7)}
  .pod1 .ring{background:linear-gradient(140deg,#ecd27e,#c39a3c);box-shadow:0 7px 18px rgba(191,155,62,.5)}
  .pod2 .ring{background:linear-gradient(140deg,#d3d7de,#969ca8);box-shadow:0 6px 14px rgba(150,156,168,.4)}
  .pod3 .ring{background:linear-gradient(140deg,#e0b487,#c0875a);box-shadow:0 6px 14px rgba(192,138,92,.4)}
  .pod .medal{position:absolute;bottom:-6px;left:50%;transform:translateX(8px);font-size:22px;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.2))}
  .pod .nm{font-size:14px;font-weight:600;margin-top:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
  .pod .sc{display:inline-block;font-size:12px;font-weight:700;padding:3px 11px;border-radius:20px;margin-top:5px}
  .pod1 .sc{color:#9a7b2e;background:#f7eecf}
  .pod2 .sc{color:#6f7681;background:#eef0f3}
  .pod3 .sc{color:#8a5f3a;background:#f5e7da}
  .pedestal{margin-top:12px;border-radius:14px 14px 5px 5px;position:relative;overflow:hidden;
    display:flex;align-items:flex-start;justify-content:center;padding-top:12px;
    font-family:'Playfair Display',serif;font-size:24px;font-weight:700;color:rgba(255,255,255,.92);
    text-shadow:0 1px 2px rgba(0,0,0,.15)}
  .pedestal:before{content:"";position:absolute;left:0;right:0;top:0;height:45%;background:linear-gradient(rgba(255,255,255,.4),transparent)}
  .pod1 .pedestal{height:108px;background:linear-gradient(#dcb95c,#bf9b3e)}
  .pod2 .pedestal{height:82px;background:linear-gradient(#c0c5cd,#969ca8)}
  .pod3 .pedestal{height:62px;background:linear-gradient(#d1a274,#c0875a)}
  .lbrow{display:flex;align-items:center;gap:12px;padding:11px 14px;background:#fff;border-radius:12px;margin-bottom:8px;
    box-shadow:0 2px 8px rgba(80,60,40,.06)}
  .lbrow.me{outline:2px solid var(--rose);background:#fff8f6}
  .lbrow .rk{font-weight:700;color:#b3a892;width:24px;text-align:center}
  .lbrow .nm2{flex:1;font-weight:600;font-size:15px}
  .lbrow .sc2{font-weight:700;color:var(--green)}
  .album{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
  .alb{background:#fff;padding:8px 8px 12px;border-radius:4px;box-shadow:0 6px 14px rgba(0,0,0,.12);transform:rotate(-1.5deg)}
  .alb:nth-child(even){transform:rotate(1.5deg)}
  .alb img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:2px;display:block}
  .alb .ct{font-family:'Caveat',cursive;font-size:16px;color:#46627d;margin-top:6px;line-height:1.15}
  .alb .meta{font-size:11px;color:#998c72;margin-top:2px}
  .empty{text-align:center;color:#b3a892;font-style:italic;padding:30px 16px}

  /* ---------- BOTTOM NAV ---------- */
  nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(253,251,244,.95);backdrop-filter:blur(8px);
    border-top:1px solid #ece2d0;display:flex;padding:6px 4px env(safe-area-inset-bottom)}
  nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;color:#b3a892;font-size:11px;position:relative}
  nav button .ic{font-size:21px}
  nav button.active{color:var(--rose-d)}
  nav button .badge{position:absolute;transform:translate(14px,-4px);background:var(--rose);color:#fff;font-size:10px;
    min-width:16px;height:16px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}

  /* ---------- MODALS ---------- */
  .ov{position:fixed;inset:0;z-index:60;background:rgba(40,30,20,.5);display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:#fff;width:100%;max-width:460px;border-radius:22px 22px 0 0;padding:22px 20px calc(26px + env(safe-area-inset-bottom));
    animation:up .25s ease}
  @keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
  .sheet h3{font-size:19px;font-weight:600;margin-bottom:4px;text-align:center}
  .sheet p.s{text-align:center;color:#998c72;font-size:14px;margin-bottom:18px;font-style:italic}
  .bigbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;border-radius:14px;
    font-size:16px;font-weight:600;margin-bottom:10px;position:relative;overflow:hidden}
  .bigbtn.cam{background:var(--rose);color:#fff}.bigbtn.imp{background:#f0e9da;color:var(--ink)}
  .bigbtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .closebtn{display:block;width:100%;text-align:center;padding:12px;color:#b3a892;font-size:14px;margin-top:4px}

  /* PIN */
  .pinbox{align-items:center}
  .pinsheet{border-radius:22px;max-width:320px;width:100%;background:#fff;padding:26px 22px}
  .pinsheet h3{margin-bottom:14px}
  .pinin{width:100%;text-align:center;font-size:30px;letter-spacing:14px;padding:12px;border:1.5px solid #e3d8c5;
    border-radius:12px;font-family:inherit;color:var(--ink)}
  .pinin:focus{outline:none;border-color:var(--gold)}
  .pinrow{display:flex;gap:10px;margin-top:16px}
  .pinrow button{flex:1;padding:13px;border-radius:12px;font-weight:600}
  .pinrow .ok{background:var(--ink);color:#fff}.pinrow .ca{background:#f0e9da;color:var(--ink)}
  .pinerr{color:#c0728a;font-size:13px;text-align:center;margin-top:10px;min-height:16px}

  /* ---------- ADMIN ---------- */
  #adm{position:fixed;inset:0;z-index:80;background:var(--dark);color:var(--dlight);display:flex;flex-direction:column;
    font-family:'Playfair Display',serif}
  .atop{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--dark2);border-bottom:1px solid #3a4358}
  .atop h2{font-size:17px;font-weight:600;letter-spacing:.5px}
  .atop .x{font-size:22px;color:#9aa6bd;padding:4px 8px}
  .atabs{display:flex;background:var(--dark2);border-bottom:1px solid #3a4358;overflow-x:auto}
  .atabs button{padding:12px 16px;font-size:13px;color:#8c97ad;white-space:nowrap;border-bottom:2px solid transparent}
  .atabs button.on{color:#fff;border-color:var(--accent)}
  .abody{flex:1;overflow-y:auto;padding:18px 16px 40px}
  .acard{background:var(--dark2);border:1px solid #3a4358;border-radius:14px;padding:16px;margin-bottom:16px}
  .acard h4{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:#8c97ad;margin-bottom:12px}
  .afield{margin-bottom:12px}
  .afield label{display:block;font-size:12px;color:#9aa6bd;margin-bottom:5px}
  .afield input,.afield textarea,.afield select{width:100%;background:var(--dark3);border:1px solid #45506a;border-radius:10px;
    padding:11px 12px;color:#fff;font-family:inherit;font-size:15px}
  .afield textarea{resize:vertical;min-height:60px}
  .afield input:focus,.afield textarea:focus,.afield select:focus{outline:none;border-color:var(--accent)}
  .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .stat{background:var(--dark3);border-radius:12px;padding:14px 8px;text-align:center}
  .stat .n{font-size:26px;font-weight:700;color:#fff}
  .stat .l{font-size:11px;color:#8c97ad;margin-top:2px}
  .phasebtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .phasebtns button{padding:14px 6px;border-radius:12px;background:var(--dark3);color:#aeb8cd;font-size:13px;font-weight:600;
    border:2px solid transparent}
  .phasebtns button.on{background:var(--accent);color:#10211c;border-color:#a7d4c7}
  .switch{width:52px;height:30px;border-radius:16px;background:#45506a;position:relative;transition:.2s;flex:none}
  .switch.on{background:var(--accent)}
  .switch span{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
  .switch.on span{left:25px}
  .togrow{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
  .togrow label{font-size:14px;color:#cdd4e0}
  .abtn{width:100%;padding:14px;border-radius:12px;font-weight:600;font-size:15px;margin-top:8px}
  .abtn.gold{background:var(--gold);color:#241e0a}
  .abtn.ghost{background:transparent;border:1px solid #566182;color:#aeb8cd}
  .abtn.danger{background:#5a2a2f;color:#ffb9c1;border:1px solid #7a3a40}
  .note{font-size:12px;color:#8c97ad;margin-top:8px;line-height:1.4}
  .note.ok{color:#8fd4bf}
  .chrow{display:grid;grid-template-columns:1fr 74px 64px 36px;gap:8px;align-items:center;margin-bottom:10px}
  .chrow input,.chrow select{padding:9px 8px;font-size:13px}
  .chrow .del{background:#4a2329;color:#ff9aa6;border-radius:9px;height:38px;font-size:16px}
  .grphead{font-family:'Caveat',cursive;font-size:22px;color:var(--accent);margin:8px 0 8px}
  .addch{width:100%;padding:10px;border:1.5px dashed #4b5670;border-radius:10px;color:#8fd4bf;font-size:13px;margin-top:2px}
  .modgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .modcard{background:var(--dark3);border-radius:12px;overflow:hidden}
  .modcard img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
  .modcard .mi{padding:8px 9px;font-size:12px}
  .modcard .mi .a{font-weight:600;color:#fff}
  .modcard .mi .c{color:#8c97ad;line-height:1.2;margin:2px 0}
  .modcard .mi .s{color:var(--gold)}
  .modcard .delm{width:100%;padding:8px;background:#4a2329;color:#ff9aa6;font-size:12px;font-weight:600}
  .toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;
    border-radius:24px;font-size:14px;z-index:90;box-shadow:var(--shadow);animation:up .2s ease;max-width:88%;text-align:center}
</style>
</head>

let _id=1; const nid=p=>p+(_id++);
const FIELD_COL={coupleNames:'couple_names',welcomeMessage:'welcome_message',pin:'pin'};

function ph(i){
  const h=(i*47)%360;
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'>
    <defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>
    <stop offset='0' stop-color='hsl(${h},62%,72%)'/><stop offset='1' stop-color='hsl(${(h+45)%360},58%,52%)'/></linearGradient></defs>
    <rect width='600' height='600' fill='url(#g)'/><text x='300' y='320' font-size='160' text-anchor='middle'>📸</text></svg>`;
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
}
function targetGroup(g){const i=STATE.groups.indexOf(g);return STATE.groups[(i+1)%STATE.groups.length];}

/* ----- seed démo (uniquement hors-ligne) ----- */
function seed(){
  STATE.challenges=SEED_CH.map(c=>({id:nid('c'),group:c.g,text:c.t,points:c.p}));
  const FAKE=['Léa','Hugo','Marie','Paul','Sarah','Lucas','Emma','Théo'];
  let pi=0;
  FAKE.forEach((nm,i)=>{
    const g=STATE.groups[i%STATE.groups.length];
    const guest={id:nid('g'),name:nm,group:g,fake:true};
    STATE.guests.push(guest);
    STATE.challenges.filter(c=>c.group===g).slice(0,2)
      .forEach(c=>STATE.submissions.push({id:nid('s'),guestId:guest.id,challengeId:c.id,group:g,photo:ph(pi++),t:Date.now()}));
  });
  STATE.guests.forEach(voter=>{
    const tg=targetGroup(voter.group);
    STATE.submissions.filter(s=>s.group===tg).forEach((s,i)=>{
      if(i<2) STATE.votes.push({id:nid('v'),voterId:voter.id,submissionId:s.id,stars:3+((i+voter.id.length)%3)});
    });
  });
}

/* =========================================================================
   SYNCHRONISATION SUPABASE  (mappe les colonnes BDD vers la forme de STATE)
   ========================================================================= */
async function pull(tbl){
  if(!LIVE) return;
  try{
    const {data,error}=await sb.from(tbl).select('*');
    if(error) throw error;
    ingest(tbl, data||[]);
  }catch(e){ console.warn('Lecture', tbl, e); }
}
function ingest(tbl,rows){
  if(tbl==='challenges')      STATE.challenges = rows.map(r=>({id:r.id,group:r.grp,text:r.label,points:r.points}));
  else if(tbl==='guests')     STATE.guests     = rows.map(r=>({id:r.id,name:r.name,group:r.grp,assigned:r.assigned||[]}));
  else if(tbl==='submissions')STATE.submissions= rows.map(r=>({id:r.id,guestId:r.guest_id,challengeId:r.challenge_id,group:r.grp,photo:r.photo_url,t:r.created_at}));
  else if(tbl==='votes')      STATE.votes      = rows.map(r=>({id:r.id,voterId:r.voter_id,submissionId:r.submission_id,stars:r.stars}));
  else if(tbl==='game_config'){
    const c=rows[0]; if(c){
      STATE.config.coupleNames=c.couple_names; STATE.config.welcomeMessage=c.welcome_message; STATE.config.pin=c.pin;
      STATE.config.deadline=c.deadline?new Date(c.deadline).getTime():null;
      STATE.config.bonus=c.bonus||[75,50,25]; STATE.config.photosDuringVote=c.photos_during_vote;
      STATE.phase=c.phase; STATE.bonusesDistributed=c.bonuses_distributed;
    }
  }
}
const _rt={};
function scheduleRefresh(tbl){ clearTimeout(_rt[tbl]); _rt[tbl]=setTimeout(async()=>{await pull(tbl);rerender();},150); }
function subscribe(){
  if(!LIVE) return;
  const chan=sb.channel('wedding');
  ['challenges','guests','submissions','votes','game_config'].forEach(t=>
    chan.on('postgres_changes',{event:'*',schema:'public',table:t},()=>scheduleRefresh(t)));
  chan.subscribe();
}

/* =========================================================================
   CALCULS
   ========================================================================= */
const ch=id=>STATE.challenges.find(c=>c.id===id);
const sub=id=>STATE.submissions.find(s=>s.id===id);
const votesFor=id=>STATE.votes.filter(v=>v.submissionId===id);
const voteCount=id=>votesFor(id).length;
const avgStars=id=>{const v=votesFor(id);return v.length?v.reduce((t,x)=>t+x.stars,0)/v.length:0;};
const guestSubs=gid=>STATE.submissions.filter(s=>s.guestId===gid);

function bonusMap(){
  const m=new Map(), byCh={}, B=STATE.config.bonus;
  STATE.submissions.forEach(s=>{(byCh[s.challengeId]=byCh[s.challengeId]||[]).push(s);});
  Object.values(byCh).forEach(list=>{
    const r=list.slice().sort((a,b)=>avgStars(b.id)-avgStars(a.id)||voteCount(b.id)-voteCount(a.id));
    B.forEach((pts,i)=>{ if(r[i]&&voteCount(r[i].id)>0) m.set(r[i].id,pts); });
  });
  return m;
}
function baseScore(gid){return guestSubs(gid).reduce((t,s)=>{const c=ch(s.challengeId);return t+(c?c.points:0);},0);}
function voteScore(gid){return new Set(STATE.votes.filter(v=>v.voterId===gid).map(v=>v.submissionId)).size*2;}
function bonusScore(gid){if(!STATE.bonusesDistributed)return 0;let t=0;bonusMap().forEach((p,id)=>{const s=sub(id);if(s&&s.guestId===gid)t+=p;});return t;}
function totalScore(gid){return baseScore(gid)+voteScore(gid)+bonusScore(gid);}
function leaderboard(){return STATE.guests.map(g=>({...g,score:totalScore(g.id)})).sort((a,b)=>b.score-a.score);}
function albumWinners(){
  const out=[];
  STATE.challenges.forEach(c=>{
    const list=STATE.submissions.filter(s=>s.challengeId===c.id&&voteCount(s.id)>0);
    if(!list.length)return;
    list.sort((a,b)=>avgStars(b.id)-avgStars(a.id)||voteCount(b.id)-voteCount(a.id));
    const w=list[0],g=STATE.guests.find(x=>x.id===w.guestId);
    out.push({sub:w,challenge:c,author:g?g.name:'?',avg:avgStars(w.id)});
  });
  return out;
}

/* =========================================================================
   COMPRESSION PHOTO → Blob (upload Supabase) ou objet local (démo)
   ========================================================================= */
function compressBlob(file,maxDim=1280,quality=.7){
  return new Promise((res,rej)=>{
    const img=new Image(),r=new FileReader();
    r.onload=e=>img.src=e.target.result; r.onerror=rej;
    img.onload=()=>{let w=img.width,h=img.height;
      if(w>h&&w>maxDim){h=Math.round(h*maxDim/w);w=maxDim;}
      else if(h>=w&&h>maxDim){w=Math.round(w*maxDim/h);h=maxDim;}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',quality);};
    img.onerror=rej; r.readAsDataURL(file);
  });
}

async function joinGame(name){
  const counts=STATE.groups.map(g=>STATE.guests.filter(x=>x.group===g).length);
  const g=STATE.groups[counts.indexOf(Math.min(...counts))];
  const pool=STATE.challenges.filter(c=>c.group===g);
  const assigned=pool.slice().sort(()=>Math.random()-.5).slice(0,5).map(c=>c.id);
  if(LIVE){
    try{
      const {data,error}=await sb.from('guests').insert({name,grp:g,assigned}).select().single();
      if(error) throw error;
      STATE.currentGuest={id:data.id,name:data.name,group:data.grp,assigned:data.assigned||[]};
      safeSet('wedding_guest',data.id);
      await pull('guests'); STATE.view='app'; STATE.tab='carnet'; render();
    }catch(e){ console.error(e); toast('Connexion impossible 😕'); }
  }else{
    const guest={id:nid('g'),name,group:g,assigned};
    STATE.guests.push(guest); STATE.currentGuest=guest;
    STATE.view='app'; STATE.tab='carnet'; render();
  }
}
async function castVote(subId,stars){
  if(STATE.votes.some(v=>v.voterId===STATE.currentGuest.id&&v.submissionId===subId)) return;
  if(LIVE){
    try{
      const {error}=await sb.from('votes').insert({voter_id:STATE.currentGuest.id,submission_id:subId,stars});
      if(error && error.code!=='23505') throw error;   // 23505 = doublon ignoré
      await pull('votes');
    }catch(e){ console.error(e); }
  }else{
    STATE.votes.push({id:nid('v'),voterId:STATE.currentGuest.id,submissionId:subId,stars});
  }
}

       <div class="stat"><div class="n">${nf}</div><div class="l">Participants</div></div>
       <div class="stat"><div class="n">${STATE.submissions.length}</div><div class="l">Photos</div></div>
       <div class="stat"><div class="n">${STATE.votes.length}</div><div class="l">Votes</div></div>
     </div>
   </div>
   <div class="acard"><h4>Phase du jeu</h4>
     <div class="phasebtns">${pb('photo','📸 Défis')}${pb('vote','💞 Votes')}${pb('results','🏆 Résultats')}</div>
     <div class="note">Photo → les invités postent. Votes → notation croisée. Résultats → tout est figé.</div>
     <div class="togrow"><label>Photos ouvertes pendant les votes</label>
       <button class="switch ${STATE.config.photosDuringVote?'on':''}" data-act="togglephotos"><span></span></button></div>
     <div class="note">Activé : les invités continuent d’ajouter des photos même en phase Votes.</div>
   </div>
   <div class="acard"><h4>Classement provisoire</h4>${top}</div>
   <div class="acard"><h4>Récompenses & remise à zéro</h4>
     <div class="note" style="margin:0 0 8px">Points bonus pour les meilleures photos de chaque défi :</div>
     <div class="stats" style="margin-bottom:12px">
       <div class="afield" style="margin:0"><label>🥇 1ʳᵉ</label><input type="number" min="0" data-bidx="0" value="${B[0]}"></div>
       <div class="afield" style="margin:0"><label>🥈 2ᵉ</label><input type="number" min="0" data-bidx="1" value="${B[1]}"></div>
       <div class="afield" style="margin:0"><label>🥉 3ᵉ</label><input type="number" min="0" data-bidx="2" value="${B[2]}"></div>
     </div>
     <button class="abtn gold" data-act="bonus">🥇 Distribuer les bonus (${B.join(' / ')})</button>
     <div class="note ${STATE.bonusesDistributed?'ok':''}">${STATE.bonusesDistributed?'✓ Bonus attribués aux meilleures photos de chaque défi.':'Récompense les meilleures photos de chaque défi (selon les étoiles).'}</div>
     <button class="abtn danger" data-act="reset" style="margin-top:14px">🗑️ Réinitialiser toutes les données</button>
   </div>`;
}
function admInfos(){
  const c=STATE.config;
  const dl=c.deadline?fmtHM(c.deadline):'aucun';
  return `
   <div class="acard"><h4>Page d’accueil</h4>
     <div class="afield"><label>Nom des mariés</label><input data-field="coupleNames" value="${esc(c.coupleNames)}"></div>
     <div class="afield"><label>Message d’accueil</label><textarea data-field="welcomeMessage">${esc(c.welcomeMessage)}</textarea></div>
   </div>
   <div class="acard"><h4>Sécurité</h4>
     <div class="afield"><label>Code PIN d’accès à cette console</label><input data-field="pin" inputmode="numeric" value="${esc(c.pin)}"></div>
     <div class="note">Accès depuis n’importe quel appareil : 5 tapes sur le nom des mariés, puis ce code.</div>
   </div>
   <div class="acard"><h4>Minuteur — fin de la session</h4>
     <div class="note" style="margin:0 0 10px">Heure de fin actuelle : <b style="color:#fff">${dl}</b></div>
     <div class="afield" style="margin-bottom:12px"><label>Choisir / modifier l’heure de fin</label><input type="time" id="endtime" value="${c.deadline?fmtHM(c.deadline):''}"></div>
     <div class="note" style="margin:0 0 8px">Ou ajouter du temps à partir de maintenant :</div>
     <div class="phasebtns">
       <button data-act="timer" data-min="30">+30 min</button>
       <button data-act="timer" data-min="60">+1 h</button>
       <button data-act="timer" data-min="120">+2 h</button>
     </div>
     <button class="abtn ghost" data-act="timer" data-min="0" style="margin-top:10px">Effacer le minuteur</button>
   </div>`;
}
function admDefis(){
  let html='<div class="acard"><h4>Défis par groupe</h4><div class="note" style="margin-bottom:14px">Les groupes (A·B·C·D) servent uniquement à la rotation des votes — ils restent invisibles pour les invités.</div>';
  STATE.groups.forEach(g=>{
    html+=`<div class="grphead">Groupe ${g}</div>`;
    STATE.challenges.filter(c=>c.group===g).forEach(c=>{
      html+=`<div class="chrow">
        <input data-cfield="text" data-id="${c.id}" value="${esc(c.text)}">
        <select data-cfield="points" data-id="${c.id}">${[2,5,7,10].map(p=>`<option value="${p}" ${c.points===p?'selected':''}>${p} pts</option>`).join('')}</select>
        <select data-cfield="group" data-id="${c.id}">${STATE.groups.map(gg=>`<option value="${gg}" ${c.group===gg?'selected':''}>Gr. ${gg}</option>`).join('')}</select>
        <button class="del" data-act="delch" data-id="${c.id}">✕</button>
      </div>`;
    });
    html+=`<button class="addch" data-act="addch" data-g="${g}">+ Ajouter un défi au groupe ${g}</button>`;
  });
  html+='</div>';
  return html;
}
function admModer(){
  if(!STATE.submissions.length)return `<div class="acard"><div class="note">Aucune photo postée pour le moment.</div></div>`;
  const cards=STATE.submissions.slice().reverse().map(s=>{
    const c=ch(s.challengeId), g=STATE.guests.find(x=>x.id===s.guestId);
    return `<div class="modcard"><img src="${s.photo}">
      <div class="mi"><div class="a">${esc(g?g.name:'?')}</div>
        <div class="c">${esc(c?c.text:'')}</div>
        <div class="s">${voteCount(s.id)?('★ '+avgStars(s.id).toFixed(1)+' ('+voteCount(s.id)+')'):'pas encore noté'}</div></div>
      <button class="delm" data-act="delsub" data-id="${s.id}">Retirer</button></div>`;
  }).join('');
  return `<div class="acard"><h4>Photos postées (${STATE.submissions.length})</h4><div class="modgrid">${cards}</div></div>`;
}

/* =========================================================================
   ÉVÉNEMENTS
   ========================================================================= */
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]'); if(!t)return;
  const a=t.dataset.act;

  if(a==='join'){const i=document.getElementById('gname');const v=(i?.value||'').trim();if(!v){i.focus();return;}joinGame(v);return;}
  if(a==='tab'){STATE.tab=t.dataset.tab;render();return;}
  if(a==='open'){openBubble(t.dataset.cid);return;}
  if(a==='closeov'){closeOverlays();return;}
  if(a==='secret'){
    STATE.secretTaps++; clearTimeout(STATE.secretTimer);
    STATE.secretTimer=setTimeout(()=>STATE.secretTaps=0,1500);
    if(STATE.secretTaps>=5){STATE.secretTaps=0;openPin();}
    return;
  }
  if(a==='pinok'){
    const v=(document.getElementById('pinin')?.value||'');
    if(v===STATE.config.pin){closeOverlays();openAdmin();}
    else{const er=document.getElementById('pinerr');if(er)er.textContent='Code incorrect';}
    return;
  }
  if(a==='rate'){
    if(STATE.rating)return; STATE.rating=true;
    const card=document.getElementById('topcard'); if(card)card.classList.add('flyout');
    const p=castVote(t.dataset.sub,+t.dataset.n);
    await new Promise(r=>setTimeout(r,300));
    try{await p;}catch(_){}
    STATE.rating=false; rerender();
    return;
  }

  /* ----- admin ----- */
  if(a==='aclose'){closeAdmin();return;}
  if(a==='atab'){STATE.adminTab=t.dataset.tab;renderAdmin();return;}
  if(a==='phase'){ if(LIVE) updateConfig({phase:t.dataset.p}); else {STATE.phase=t.dataset.p;render();renderAdmin();} return; }
  if(a==='togglephotos'){ const nv=!STATE.config.photosDuringVote; if(LIVE) updateConfig({photos_during_vote:nv}); else {STATE.config.photosDuringVote=nv;renderAdmin();} return; }
  if(a==='bonus'){ if(LIVE) updateConfig({bonuses_distributed:true}); else {STATE.bonusesDistributed=true;renderAdmin();} toast('Bonus distribués 🥇'); return; }
  if(a==='reset'){ if(confirm('Effacer TOUS les participants, photos et votes ?\nCette action est définitive.')){ if(LIVE) resetLive(); else {STATE.guests=[];STATE.submissions=[];STATE.votes=[];STATE.currentGuest=null;STATE.bonusesDistributed=false;STATE.phase='photo';STATE.view='join';closeAdmin();} } return; }
  if(a==='timer'){ const m=+t.dataset.min; const ms=m?Date.now()+m*60000:null; if(LIVE) updateConfig({deadline:ms?new Date(ms).toISOString():null}); else {STATE.config.deadline=ms;renderAdmin();} return; }
  if(a==='addch'){
    if(LIVE){try{await sb.from('challenges').insert({grp:t.dataset.g,label:'Nouveau défi',points:5});await pull('challenges');rerender();}catch(e){console.error(e);}}
    else {STATE.challenges.push({id:nid('c'),group:t.dataset.g,text:'Nouveau défi',points:5});renderAdmin();}
    return;
  }
  if(a==='delch'){
    const id=t.dataset.id;
    if(LIVE){try{await sb.from('challenges').delete().eq('id',id);await pull('challenges');rerender();}catch(e){console.error(e);}}
    else {STATE.challenges=STATE.challenges.filter(c=>c.id!==id);renderAdmin();}
    return;
  }
  if(a==='delsub'){
    const id=t.dataset.id;
    if(LIVE){try{await sb.from('submissions').delete().eq('id',id);await pull('submissions');await pull('votes');rerender();}catch(e){console.error(e);}}
    else {STATE.submissions=STATE.submissions.filter(s=>s.id!==id);STATE.votes=STATE.votes.filter(v=>sub(v.submissionId));renderAdmin();}
    return;
  }
});

/* changements : photo, heure de fin, sélecteurs/bonus admin */
document.addEventListener('change',async e=>{
  const t=e.target;

  if(t.dataset.act==='cap'){
    const f=t.files&&t.files[0]; const cid=t.dataset.cid; t.value=''; closeOverlays();
    if(!f) return;
    if(LIVE){
      try{
        toast('Envoi de la photo…');
        const blob=await compressBlob(f);
        const path=`${STATE.currentGuest.id}/${cid}_${Date.now()}.jpg`;
        const {error:e1}=await sb.storage.from('photos').upload(path,blob,{contentType:'image/jpeg'});
        if(e1) throw e1;
        const url=sb.storage.from('photos').getPublicUrl(path).data.publicUrl;
        const {error:e2}=await sb.from('submissions').insert({guest_id:STATE.currentGuest.id,challenge_id:cid,grp:STATE.currentGuest.group,photo_url:url});
        if(e2) throw e2;
        await pull('submissions'); rerender();
      }catch(err){ console.error(err); toast('Échec de l’envoi 😕'); }
    }else{
      try{const blob=await compressBlob(f);const url=URL.createObjectURL(blob);
        STATE.submissions.push({id:nid('s'),guestId:STATE.currentGuest.id,challengeId:cid,group:STATE.currentGuest.group,photo:url,t:Date.now()});
        render();
      }catch(_){ toast('Image illisible'); }
    }
    return;
  }

  if(t.id==='endtime'){
    const v=t.value; let ms=null;
    if(v){const [h,m]=v.split(':').map(Number);const d=new Date();d.setHours(h||0,m||0,0,0);ms=d.getTime();}
    if(LIVE) updateConfig({deadline:ms?new Date(ms).toISOString():null});
    else {STATE.config.deadline=ms;renderAdmin();}
    return;
  }
  if(t.dataset.bidx){ if(LIVE) updateConfig({bonus:STATE.config.bonus}); else renderAdmin(); return; }
  if(t.dataset.field){ if(LIVE){const col=FIELD_COL[t.dataset.field]; if(col) updateConfig({[col]:t.value});} return; }
  if(t.dataset.cfield){
    const id=t.dataset.id, c=ch(id);
    if(c){ if(t.dataset.cfield==='points')c.points=+t.value; else if(t.dataset.cfield==='group')c.group=t.value; else c.text=t.value; }
    if(LIVE){
      const col=t.dataset.cfield==='points'?'points':t.dataset.cfield==='group'?'grp':'label';
      const val=t.dataset.cfield==='points'?+t.value:t.value;
      try{await sb.from('challenges').update({[col]:val}).eq('id',id);}catch(err){console.error(err);}
    }
    return;
  }
});

/* saisie en continu (affichage local, sans écriture BDD) */
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.field){STATE.config[t.dataset.field]=t.value;}
  else if(t.dataset.bidx){STATE.config.bonus[+t.dataset.bidx]=Math.max(0,parseInt(t.value)||0);}
  else if(t.dataset.cfield==='text'){const c=ch(t.dataset.id);if(c)c.text=t.value;}
});

/* =========================================================================
   DÉMARRAGE
   ========================================================================= */
async function init(){
  if(LIVE){
    showConnecting();
    await Promise.all([pull('game_config'),pull('challenges'),pull('guests'),pull('submissions'),pull('votes')]);
    const sid=safeGet('wedding_guest');
    if(sid){const g=STATE.guests.find(x=>x.id===sid); if(g){STATE.currentGuest=g;STATE.view='app';STATE.tab='carnet';}}
    subscribe();
    render();
  }else{
    seed();
    render();
  }
}
init();
</script>
