<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Défis Photos Mariage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Fredoka:wght@500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    /* ===== THÈME (valeurs par défaut = thème "Romantique" actuel) ===== */
    --bg:#faf5ec; --surface:#fdfbf4; --ink:#3a342b; --muted:#8a8270;
    --accent:#c98a7d; --accent-d:#b06b5d; --accent-soft:#fbe9e5;
    --gold:#bfa15a; --green:#6f7d5e;
    --line:#e9f0f7; --margin:#e7a8a0; --hand-ink:#46627d;
    --header-bg:rgba(250,245,236,.92); --nav-bg:rgba(253,251,244,.95);
    --glow:#fff8ee; --border:#ece2d0;
    --font-head:'Playfair Display',Georgia,serif; --font-hand:'Caveat',cursive;
    /* ===== CONSTANTES (console + ombrages) ===== */
    --shadow:0 8px 24px rgba(80,60,40,.14);
    --dark:#1f2530; --dark2:#2a3140; --dark3:#353d4f; --dlight:#e7ebf2; --adm-accent:#7fb3a3;
  }
  /* ===== THÈME : Festif & coloré ===== */
  [data-theme="colorful"]{
    --bg:#fdf2f8; --surface:#ffffff; --ink:#2a2440; --muted:#7b6ca0;
    --accent:#e0218a; --accent-d:#c01277; --accent-soft:#fde4f2;
    --gold:#ffb300; --green:#10b981;
    --line:#ffe0ef; --margin:#7c3aed; --hand-ink:#7c3aed;
    --header-bg:rgba(253,242,248,.9); --nav-bg:rgba(255,255,255,.95);
    --glow:#ffe9f6; --border:#f3d9e8;
    --font-head:'Fredoka',sans-serif; --font-hand:'Caveat',cursive;
  }
  [data-theme="colorful"] .join{background:linear-gradient(135deg,#fde4f2,#e9e0ff 50%,#fff4d6)}
  /* Festif & coloré : éclaboussures aquarelle dans les coins de l'écran */
  [data-theme="colorful"] body:before{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(circle at 0% 0%,rgba(124,58,237,.22),transparent 24%),
      radial-gradient(circle at 100% 6%,rgba(16,185,129,.20),transparent 22%),
      radial-gradient(circle at 4% 100%,rgba(224,33,138,.20),transparent 24%),
      radial-gradient(circle at 100% 100%,rgba(255,140,0,.22),transparent 24%),
      radial-gradient(circle at 100% 42%,rgba(255,179,0,.14),transparent 20%);
  }
  /* Titre arc-en-ciel + surligneur façon feutre */
  [data-theme="colorful"] .nb-title{background:linear-gradient(95deg,#7c3aed,#e0218a 35%,#ff7a00 68%,#10b981);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;font-weight:700}
  [data-theme="colorful"] .nb-sub{display:inline-block;color:#7a5510;background:linear-gradient(transparent 52%,#ffd96b 52%);padding:0 10px 1px;border-radius:5px;transform:rotate(-1.2deg)}
  /* Boutons, pastilles et bandeaux plus vifs */
  [data-theme="colorful"] .cta,[data-theme="colorful"] .bigbtn.cam{background:linear-gradient(120deg,#e0218a,#ff6a00 55%,#ffb300);box-shadow:0 8px 22px rgba(224,33,138,.38)}
  [data-theme="colorful"] .hscore{background:linear-gradient(120deg,#10b981,#0ea5a5)}
  [data-theme="colorful"] .htimer{background:linear-gradient(120deg,#fde0ee,#ffe9c7);color:#c01277}
  [data-theme="colorful"] nav button .badge{background:linear-gradient(120deg,#e0218a,#ff7a00)}
  [data-theme="colorful"] .phasebanner{background:linear-gradient(120deg,#fde4f2,#e9e0ff 55%,#fff0d6);border:1px solid #f3cfe6;color:#6b4fae}
  [data-theme="colorful"] .pts{box-shadow:0 2px 7px rgba(0,0,0,.13)}
  [data-theme="colorful"] .check{border-color:#e7a9da}
  [data-theme="colorful"] .lbrow{box-shadow:0 3px 12px rgba(124,58,237,.10)}
  [data-theme="colorful"] .sectitle{color:#c01277}
  /* ===== THÈME : Champêtre ===== */
  [data-theme="champetre"]{
    --bg:#f3ecde; --surface:#fbf6ea; --ink:#3f3a2c; --muted:#8c8163;
    --accent:#7d8b5a; --accent-d:#5f6e42; --accent-soft:#e8ecdb;
    --gold:#c69a4e; --green:#6f7d4e;
    --line:#e3e7d2; --margin:#b9893f; --hand-ink:#6b5a3a;
    --header-bg:rgba(243,236,222,.92); --nav-bg:rgba(251,246,234,.95);
    --glow:#fbf3df; --border:#e3dac3;
    --font-head:'Playfair Display',Georgia,serif; --font-hand:'Caveat',cursive;
  }
  /* ===== THÈME : Sobre & épuré ===== */
  [data-theme="sobre"]{
    --bg:#f7f7f6; --surface:#ffffff; --ink:#1f2328; --muted:#8a9099;
    --accent:#3d4756; --accent-d:#2a323d; --accent-soft:#eceef1;
    --gold:#a8a29e; --green:#6b8f7d;
    --line:#eceef1; --margin:#d6dadf; --hand-ink:#3d4756;
    --header-bg:rgba(247,247,246,.9); --nav-bg:rgba(255,255,255,.95);
    --glow:#ffffff; --border:#e6e8eb;
    --font-head:'Poppins',system-ui,sans-serif; --font-hand:'Poppins',system-ui,sans-serif;
  }
  /* ===== THÈME : Alsace × Espagne ===== */
  [data-theme="alsace-espagne"]{
    --bg:#fbf1e2; --surface:#fff8ec; --ink:#3a2a22; --muted:#9a7d63;
    --accent:#c0392b; --accent-d:#9c2b20; --accent-soft:#f7e0d3;
    --gold:#e0a526; --green:#5d7c4f;
    --line:#f0e2cf; --margin:#2e6b8f; --hand-ink:#2e6b8f;
    --header-bg:rgba(251,241,226,.92); --nav-bg:rgba(255,248,236,.95);
    --glow:#fdeede; --border:#ecdcc3;
    --font-head:'Playfair Display',Georgia,serif; --font-hand:'Caveat',cursive;
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:var(--font-head);background:var(--bg);color:var(--ink);overflow-x:hidden;transition:background .3s}
  #screen{min-height:100vh;display:flex;flex-direction:column}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .hand{font-family:var(--font-hand)}

  /* ---------- JOIN ---------- */
  .join{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:42px 26px;
    background:radial-gradient(circle at 50% 18%,var(--glow),var(--bg))}
  .join .deco{font-size:34px;letter-spacing:6px;color:var(--gold);opacity:.85;margin-bottom:14px}
  .join h1{font-size:13px;letter-spacing:5px;text-transform:uppercase;color:var(--accent-d);font-weight:500;margin-bottom:8px}
  .join .names{font-size:46px;line-height:1.15;color:var(--ink);margin:6px 0 4px;font-weight:600}
  .join .sub{font-size:18px;color:var(--muted);font-style:italic;max-width:330px;margin:14px auto 30px}
  .join .field{width:100%;max-width:320px}
  .join input{width:100%;padding:15px 18px;border:1.5px solid var(--border);border-radius:14px;background:#fff;font-size:17px;
    font-family:inherit;text-align:center;color:var(--ink)}
  .join input:focus{outline:none;border-color:var(--accent)}
  .cta{width:100%;max-width:320px;margin-top:14px;padding:15px;border-radius:14px;background:var(--accent);color:#fff;
    font-size:17px;font-weight:600;letter-spacing:.5px;box-shadow:0 6px 16px rgba(0,0,0,.14)}
  .cta:active{transform:scale(.98)}

  /* ---------- HEADER ---------- */
  header{position:sticky;top:0;z-index:30;background:var(--header-bg);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .hnames{font-size:20px;font-weight:600;color:var(--ink);line-height:1;cursor:pointer;user-select:none;flex:1;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .htimer{font-size:13px;color:var(--accent-d);font-weight:600;background:var(--accent-soft);padding:5px 10px;border-radius:20px;white-space:nowrap}
  .htimer.off{background:var(--border);color:var(--muted)}
  .hscore{font-size:14px;font-weight:700;color:#fff;background:var(--green);padding:6px 11px;border-radius:20px;white-space:nowrap}

  main{flex:1;padding:18px 16px 96px}
  .phasebanner{text-align:center;font-style:italic;color:var(--muted);font-size:14px;background:var(--accent-soft);
    border-radius:12px;padding:10px;margin-bottom:16px;line-height:1.35}

  /* ---------- CARNET ---------- */
  .notebook{background:var(--surface);border-radius:10px;box-shadow:var(--shadow);padding:26px 20px 30px 46px;position:relative;
    background-image:repeating-linear-gradient(transparent,transparent 37px,var(--line) 37px,var(--line) 38px);overflow:hidden}
  .notebook:before{content:"";position:absolute;top:0;bottom:0;left:30px;width:2px;background:var(--margin);opacity:.55}
  .nb-title{font-family:var(--font-hand);font-size:34px;color:var(--hand-ink);margin-bottom:10px;line-height:1.2}
  .nb-sub{font-family:var(--font-hand);font-size:19px;color:var(--muted);margin-bottom:18px}
  .task{display:flex;align-items:flex-start;gap:12px;padding:7px 0;min-height:38px;line-height:38px}
  .check{flex:none;width:26px;height:26px;border:2px solid #b9c6d3;border-radius:7px;margin-top:6px;display:flex;
    align-items:center;justify-content:center;font-size:18px;color:#fff;transition:.2s}
  .task.done .check{background:var(--green);border-color:var(--green)}
  .task .txt{font-family:var(--font-hand);font-size:23px;color:var(--ink);flex:1;cursor:pointer}
  .task.done .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:#bcc3b1;cursor:default}
  .task.locked .txt{cursor:default}
  .pts{font-family:var(--font-head);font-size:12px;font-weight:700;color:#fff;border-radius:20px;padding:3px 9px;
    margin-top:9px;flex:none;line-height:1}
  .p2{background:#9bb07f}.p5{background:#6f9ec4}.p7{background:#c79a5b}.p10{background:#c0728a}
  .polaroid{margin:4px 0 10px 38px;background:#fff;padding:8px 8px 26px;border-radius:3px;box-shadow:0 6px 14px rgba(0,0,0,.18);
    width:138px;transform:rotate(-2.5deg);position:relative}
  .polaroid:nth-child(even){transform:rotate(2deg)}
  .polaroid img{width:122px;height:122px;object-fit:cover;display:block;border-radius:2px}
  .polaroid:after{content:"";position:absolute;top:-9px;left:42px;width:54px;height:18px;background:rgba(214,228,238,.7);
    transform:rotate(-4deg);box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .nb-hint{font-family:var(--font-hand);font-size:18px;color:var(--muted);margin-top:22px;text-align:center;line-height:1.3}

  /* ---------- VOTE (Tinder) ---------- */
  .voteWrap{display:flex;flex-direction:column;align-items:center}
  .vintro{font-style:italic;color:var(--muted);text-align:center;margin-bottom:16px;font-size:14px}
  .stack{position:relative;width:100%;max-width:340px;height:460px;margin:0 auto}
  .card{position:absolute;inset:0;background:#fff;border-radius:20px;box-shadow:0 14px 34px rgba(60,45,30,.22);overflow:hidden;
    display:flex;flex-direction:column;transition:transform .3s ease,opacity .3s ease}
  .card.flyout{transform:translateY(-40px) rotate(-6deg) scale(.94);opacity:0}
  .card.behind{transform:scale(.94) translateY(14px);box-shadow:0 8px 20px rgba(60,45,30,.12)}
  .card .photo{flex:1;background:#eee;background-size:cover;background-position:center}
  .card .clabel{position:absolute;top:14px;left:14px;right:14px;background:rgba(31,37,48,.78);color:#fff;font-size:14px;
    padding:9px 13px;border-radius:12px;line-height:1.25;backdrop-filter:blur(4px)}
  .card .clabel b{font-family:var(--font-hand);font-size:13px;display:block;color:#ffd9b0;letter-spacing:1px;text-transform:uppercase;font-weight:700}
  .rateBar{padding:16px 14px 18px;text-align:center;background:#fff}
  .rateBar .q{font-style:italic;color:var(--muted);font-size:14px;margin-bottom:8px}
  .stars{display:flex;justify-content:center;gap:8px}
  .stars span{font-size:36px;color:#dcd3c2;transition:.12s;line-height:1}
  .stars span:active{transform:scale(1.25)}
  .vdone{text-align:center;padding:50px 24px;color:var(--muted)}
  .vdone .big{font-size:54px;margin-bottom:12px}
  .vcount{margin-top:16px;font-size:13px;color:var(--muted);text-align:center}

  /* ---------- PALMARÈS ---------- */
  .sectitle{font-size:22px;font-weight:600;text-align:center;margin:6px 0 18px;color:var(--ink)}
  .podwrap{margin:10px 0 26px;position:relative}
  .podwrap:before{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);width:140px;height:140px;
    background:radial-gradient(circle,rgba(191,161,90,.16),transparent 70%);pointer-events:none}
  .podium{display:flex;align-items:flex-end;justify-content:center;gap:12px;position:relative}
  .pod{flex:1;max-width:114px;text-align:center;position:relative}
  .pod .crown{font-size:26px;line-height:1;margin-bottom:4px;filter:drop-shadow(0 3px 4px rgba(191,161,90,.45))}
  .pod .ring{width:64px;height:64px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;
    font-family:var(--font-hand);font-size:30px;font-weight:700;color:#fff;position:relative;border:3px solid rgba(255,255,255,.7)}
  .pod1 .ring{background:linear-gradient(140deg,#ecd27e,#c39a3c);box-shadow:0 7px 18px rgba(191,155,62,.5)}
  .pod2 .ring{background:linear-gradient(140deg,#d3d7de,#969ca8);box-shadow:0 6px 14px rgba(150,156,168,.4)}
  .pod3 .ring{background:linear-gradient(140deg,#e0b487,#c0875a);box-shadow:0 6px 14px rgba(192,138,92,.4)}
  .pod .medal{position:absolute;bottom:-6px;left:50%;transform:translateX(8px);font-size:22px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.2))}
  .pod .nm{font-size:14px;font-weight:600;margin-top:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
  .pod .sc{display:inline-block;font-size:12px;font-weight:700;padding:3px 11px;border-radius:20px;margin-top:5px}
  .pod1 .sc{color:#9a7b2e;background:#f7eecf}
  .pod2 .sc{color:#6f7681;background:#eef0f3}
  .pod3 .sc{color:#8a5f3a;background:#f5e7da}
  .pedestal{margin-top:12px;border-radius:14px 14px 5px 5px;position:relative;overflow:hidden;
    display:flex;align-items:flex-start;justify-content:center;padding-top:12px;
    font-family:var(--font-head);font-size:24px;font-weight:700;color:rgba(255,255,255,.92);text-shadow:0 1px 2px rgba(0,0,0,.15)}
  .pedestal:before{content:"";position:absolute;left:0;right:0;top:0;height:45%;background:linear-gradient(rgba(255,255,255,.4),transparent)}
  .pod1 .pedestal{height:108px;background:linear-gradient(#dcb95c,#bf9b3e)}
  .pod2 .pedestal{height:82px;background:linear-gradient(#c0c5cd,#969ca8)}
  .pod3 .pedestal{height:62px;background:linear-gradient(#d1a274,#c0875a)}
  .lbrow{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--surface);border-radius:12px;margin-bottom:8px;
    box-shadow:0 2px 8px rgba(80,60,40,.06)}
  .lbrow.me{outline:2px solid var(--accent);background:var(--accent-soft)}
  .lbrow .rk{font-weight:700;color:var(--muted);width:24px;text-align:center}
  .lbrow .nm2{flex:1;font-weight:600;font-size:15px}
  .lbrow .sc2{font-weight:700;color:var(--green)}
  .album{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
  .alb{background:#fff;padding:8px 8px 12px;border-radius:4px;box-shadow:0 6px 14px rgba(0,0,0,.12);transform:rotate(-1.5deg)}
  .alb:nth-child(even){transform:rotate(1.5deg)}
  .alb img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:2px;display:block}
  .alb .ct{font-family:var(--font-hand);font-size:16px;color:var(--hand-ink);margin-top:6px;line-height:1.15}
  .alb .meta{font-size:11px;color:var(--muted);margin-top:2px}
  .empty{text-align:center;color:var(--muted);font-style:italic;padding:30px 16px}

  /* ---------- BOTTOM NAV ---------- */
  nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--nav-bg);backdrop-filter:blur(8px);
    border-top:1px solid var(--border);display:flex;padding:6px 4px env(safe-area-inset-bottom)}
  nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;color:var(--muted);font-size:11px;position:relative}
  nav button .ic{font-size:21px}
  nav button.active{color:var(--accent-d)}
  nav button .badge{position:absolute;transform:translate(14px,-4px);background:var(--accent);color:#fff;font-size:10px;
    min-width:16px;height:16px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}

  /* ---------- MODALS ---------- */
  .ov{position:fixed;inset:0;z-index:60;background:rgba(40,30,20,.5);display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:#fff;width:100%;max-width:460px;border-radius:22px 22px 0 0;padding:22px 20px calc(26px + env(safe-area-inset-bottom));animation:up .25s ease;color:var(--ink)}
  @keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
  .sheet h3{font-size:19px;font-weight:600;margin-bottom:4px;text-align:center}
  .sheet p.s{text-align:center;color:var(--muted);font-size:14px;margin-bottom:18px;font-style:italic}
  .bigbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;border-radius:14px;
    font-size:16px;font-weight:600;margin-bottom:10px;position:relative;overflow:hidden}
  .bigbtn.cam{background:var(--accent);color:#fff}.bigbtn.imp{background:var(--accent-soft);color:var(--ink)}
  .bigbtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .closebtn{display:block;width:100%;text-align:center;padding:12px;color:var(--muted);font-size:14px;margin-top:4px}
  .pinbox{align-items:center}
  .pinsheet{border-radius:22px;max-width:320px;width:100%;background:#fff;padding:26px 22px;color:var(--ink)}
  .pinsheet h3{margin-bottom:14px}
  .pinin{width:100%;text-align:center;font-size:30px;letter-spacing:14px;padding:12px;border:1.5px solid var(--border);
    border-radius:12px;font-family:inherit;color:var(--ink)}
  .pinin:focus{outline:none;border-color:var(--gold)}
  .pinrow{display:flex;gap:10px;margin-top:16px}
  .pinrow button{flex:1;padding:13px;border-radius:12px;font-weight:600}
  .pinrow .ok{background:var(--ink);color:#fff}.pinrow .ca{background:var(--accent-soft);color:var(--ink)}
  .pinerr{color:#c0728a;font-size:13px;text-align:center;margin-top:10px;min-height:16px}

  /* ---------- ADMIN (console — toujours sombre, indépendant du thème) ---------- */
  #adm{position:fixed;inset:0;z-index:80;background:var(--dark);color:var(--dlight);display:flex;flex-direction:column;
    font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
  .atop{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--dark2);border-bottom:1px solid #3a4358}
  .atop h2{font-size:17px;font-weight:600;letter-spacing:.5px}
  .atop .x{font-size:22px;color:#9aa6bd;padding:4px 8px}
  .atabs{display:flex;background:var(--dark2);border-bottom:1px solid #3a4358;overflow-x:auto}
  .atabs button{padding:12px 15px;font-size:13px;color:#8c97ad;white-space:nowrap;border-bottom:2px solid transparent}
  .atabs button.on{color:#fff;border-color:var(--adm-accent)}
  .abody{flex:1;overflow-y:auto;padding:18px 16px 40px}
  .acard{background:var(--dark2);border:1px solid #3a4358;border-radius:14px;padding:16px;margin-bottom:16px}
  .acard h4{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:#8c97ad;margin-bottom:12px}
  .afield{margin-bottom:12px}
  .afield label{display:block;font-size:12px;color:#9aa6bd;margin-bottom:5px}
  .afield input,.afield textarea,.afield select{width:100%;background:var(--dark3);border:1px solid #45506a;border-radius:10px;
    padding:11px 12px;color:#fff;font-family:inherit;font-size:15px}
  .afield textarea{resize:vertical;min-height:60px}
  .afield input:focus,.afield textarea:focus,.afield select:focus{outline:none;border-color:var(--adm-accent)}
  .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .stat{background:var(--dark3);border-radius:12px;padding:14px 8px;text-align:center}
  .stat .n{font-size:26px;font-weight:700;color:#fff}
  .stat .l{font-size:11px;color:#8c97ad;margin-top:2px}
  .phasebtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

function nextGroupLabel(){const A='ABCDEFGHIJKLMNOPQRSTUVWXYZ';for(const L of A)if(!STATE.groups.includes(L))return L;return 'G'+(STATE.groups.length+1);}

/* =========================================================================
   SYNCHRONISATION SUPABASE
   ========================================================================= */
async function pull(tbl){
  if(!LIVE) return;
  try{ const {data,error}=await sb.from(tbl).select('*'); if(error) throw error; ingest(tbl,data||[]); }
  catch(e){ console.warn('Lecture',tbl,e); }
}
function ingest(tbl,rows){
  if(tbl==='challenges')      STATE.challenges = rows.map(r=>({id:r.id,group:r.grp,text:r.label,points:r.points}));
  else if(tbl==='guests')     STATE.guests     = rows.map(r=>({id:r.id,name:r.name,group:r.grp,assigned:r.assigned||[]}));
  else if(tbl==='submissions')STATE.submissions= rows.map(r=>({id:r.id,guestId:r.guest_id,challengeId:r.challenge_id,group:r.grp,photo:r.photo_url,t:r.created_at}));
  else if(tbl==='votes')      STATE.votes      = rows.map(r=>({id:r.id,voterId:r.voter_id,submissionId:r.submission_id,stars:r.stars}));
  else if(tbl==='game_config'){
    const c=rows[0]; if(c){
      STATE.config.coupleNames=c.couple_names; STATE.config.welcomeMessage=c.welcome_message; STATE.config.pin=c.pin;
      STATE.config.deadline=c.deadline?new Date(c.deadline).getTime():null;
      STATE.config.bonus=c.bonus||[75,50,25]; STATE.config.photosDuringVote=c.photos_during_vote;
      STATE.config.theme=c.theme||'classic';
      STATE.groups=(Array.isArray(c.groups)&&c.groups.length)?c.groups:['A','B','C','D'];
      STATE.phase=c.phase; STATE.bonusesDistributed=c.bonuses_distributed;
    }
  }
}
const _rt={};
function scheduleRefresh(tbl){ clearTimeout(_rt[tbl]); _rt[tbl]=setTimeout(async()=>{await pull(tbl);rerender();},150); }
function subscribe(){
  if(!LIVE) return;
  const chan=sb.channel('wedding');
  ['challenges','guests','submissions','votes','game_config'].forEach(t=>chan.on('postgres_changes',{event:'*',schema:'public',table:t},()=>scheduleRefresh(t)));
  chan.subscribe();
}
function rerender(){
  if(STATE.view!=='join') render();
  if(STATE.adminOpen){
    const ae=document.activeElement, panel=document.getElementById('adm');

/* =========================================================================
   CALCULS
   ========================================================================= */
const ch=id=>STATE.challenges.find(c=>c.id===id);
const sub=id=>STATE.submissions.find(s=>s.id===id);
const votesFor=id=>STATE.votes.filter(v=>v.submissionId===id);
const voteCount=id=>votesFor(id).length;
const avgStars=id=>{const v=votesFor(id);return v.length?v.reduce((t,x)=>t+x.stars,0)/v.length:0;};
const guestSubs=gid=>STATE.submissions.filter(s=>s.guestId===gid);
function bonusMap(){
  const m=new Map(), byCh={}, B=STATE.config.bonus;
  STATE.submissions.forEach(s=>{(byCh[s.challengeId]=byCh[s.challengeId]||[]).push(s);});
  Object.values(byCh).forEach(list=>{const r=list.slice().sort((a,b)=>avgStars(b.id)-avgStars(a.id)||voteCount(b.id)-voteCount(a.id));
    B.forEach((pts,i)=>{ if(r[i]&&voteCount(r[i].id)>0) m.set(r[i].id,pts); });});
  return m;
}
function baseScore(gid){return guestSubs(gid).reduce((t,s)=>{const c=ch(s.challengeId);return t+(c?c.points:0);},0);}
function voteScore(gid){return new Set(STATE.votes.filter(v=>v.voterId===gid).map(v=>v.submissionId)).size*2;}
function bonusScore(gid){if(!STATE.bonusesDistributed)return 0;let t=0;bonusMap().forEach((p,id)=>{const s=sub(id);if(s&&s.guestId===gid)t+=p;});return t;}
function totalScore(gid){return baseScore(gid)+voteScore(gid)+bonusScore(gid);}
function leaderboard(){return STATE.guests.map(g=>({...g,score:totalScore(g.id)})).sort((a,b)=>b.score-a.score);}
function albumWinners(){
  const out=[];
  STATE.challenges.forEach(c=>{const list=STATE.submissions.filter(s=>s.challengeId===c.id&&voteCount(s.id)>0);
    if(!list.length)return; list.sort((a,b)=>avgStars(b.id)-avgStars(a.id)||voteCount(b.id)-voteCount(a.id));
    const w=list[0],g=STATE.guests.find(x=>x.id===w.guestId); out.push({sub:w,challenge:c,author:g?g.name:'?',avg:avgStars(w.id)});});
  return out;
}

/* =========================================================================
   PHOTO → Blob
   ========================================================================= */
function compressBlob(file,maxDim=1280,quality=.7){
  return new Promise((res,rej)=>{
    const img=new Image(),r=new FileReader();
    r.onload=e=>img.src=e.target.result; r.onerror=rej;
    img.onload=()=>{let w=img.width,h=img.height;
      if(w>h&&w>maxDim){h=Math.round(h*maxDim/w);w=maxDim;} else if(h>=w&&h>maxDim){w=Math.round(w*maxDim/h);h=maxDim;}
      const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
      c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',quality);};
    img.onerror=rej; r.readAsDataURL(file);
  });
}

async function joinGame(name){
  const withCh = STATE.groups.filter(g=>STATE.challenges.some(c=>c.group===g));
  const pickFrom = withCh.length?withCh:STATE.groups;
  const counts=pickFrom.map(g=>STATE.guests.filter(x=>x.group===g).length);
  const g=pickFrom[counts.indexOf(Math.min(...counts))];
  const pool=STATE.challenges.filter(c=>c.group===g);
  const assigned=pool.slice().sort(()=>Math.random()-.5).slice(0,5).map(c=>c.id);
  if(LIVE){
    try{
      const {data,error}=await sb.from('guests').insert({name,grp:g,assigned}).select().single(); if(error) throw error;
      STATE.currentGuest={id:data.id,name:data.name,group:data.grp,assigned:data.assigned||[]};
      safeSet('wedding_guest',data.id); await pull('guests'); STATE.view='app'; STATE.tab='carnet'; render();
    }catch(e){ console.error(e); toast('Connexion impossible 😕'); }
  }else{
    const guest={id:nid('g'),name,group:g,assigned}; STATE.guests.push(guest); STATE.currentGuest=guest;
    STATE.view='app'; STATE.tab='carnet'; render();
  }
}
async function castVote(subId,stars){

}

  const hint = locked

  const tg=targetGroup(me.group);

  const stars=[1,2,3,4,5].map(n=>`<span data-act="rate" data-sub="${top.id}" data-n="${n}">★</span>`).join('');
  return `<div class="voteWrap"><div class="vintro">Note les photos des autres invités — chaque vote te rapporte <b>+2 pts</b></div>

    <div class="vcount">${queue.length} photo${queue.length>1?'s':''} à juger</div></div>`;
}

function timerText(){

document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]'); if(!t)return; const a=t.dataset.act;

  if(a==='join'){const i=document.getElementById('gname');const v=(i?.value||'').trim();if(!v){i.focus();return;}joinGame(v);return;}
  if(a==='tab'){STATE.tab=t.dataset.tab;render();return;}
  if(a==='open'){openBubble(t.dataset.cid);return;}
  if(a==='closeov'){closeOverlays();return;}
  if(a==='secret'){STATE.secretTaps++;clearTimeout(STATE.secretTimer);STATE.secretTimer=setTimeout(()=>STATE.secretTaps=0,1500);if(STATE.secretTaps>=5){STATE.secretTaps=0;openPin();}return;}
  if(a==='pinok'){const v=(document.getElementById('pinin')?.value||'');if(v===STATE.config.pin){closeOverlays();openAdmin();}else{const er=document.getElementById('pinerr');if(er)er.textContent='Code incorrect';}return;}
  if(a==='rate'){
    if(STATE.rating)return; STATE.rating=true;
    const card=document.getElementById('topcard'); if(card)card.classList.add('flyout');
    const p=castVote(t.dataset.sub,+t.dataset.n);
    await new Promise(r=>setTimeout(r,300)); try{await p;}catch(_){}
    STATE.rating=false; rerender(); return;
  }

  /* ----- admin ----- */
  if(a==='aclose'){closeAdmin();return;}
  if(a==='atab'){STATE.adminTab=t.dataset.tab;renderAdmin();return;}
  if(a==='theme'){ const id=t.dataset.id; if(LIVE) updateConfig({theme:id}); else {STATE.config.theme=id;applyTheme();renderAdmin();} return; }
  if(a==='phase'){ if(LIVE) updateConfig({phase:t.dataset.p}); else {STATE.phase=t.dataset.p;render();renderAdmin();} return; }
  if(a==='togglephotos'){ const nv=!STATE.config.photosDuringVote; if(LIVE) updateConfig({photos_during_vote:nv}); else {STATE.config.photosDuringVote=nv;renderAdmin();} return; }
  if(a==='bonus'){ if(LIVE) updateConfig({bonuses_distributed:true}); else {STATE.bonusesDistributed=true;renderAdmin();} toast('Bonus distribués 🥇'); return; }
  if(a==='reset'){ if(confirm('Effacer TOUS les participants, photos et votes ?\nCette action est définitive.')){ if(LIVE) resetLive(); else {STATE.guests=[];STATE.submissions=[];STATE.votes=[];STATE.currentGuest=null;STATE.bonusesDistributed=false;STATE.phase='photo';STATE.view='join';closeAdmin();} } return; }
  if(a==='timer'){ const m=+t.dataset.min; const ms=m?Date.now()+m*60000:null; if(LIVE) updateConfig({deadline:ms?new Date(ms).toISOString():null}); else {STATE.config.deadline=ms;renderAdmin();} return; }
  if(a==='addch'){ if(LIVE){try{await sb.from('challenges').insert({grp:t.dataset.g,label:'Nouveau défi',points:5});await pull('challenges');rerender();}catch(e){console.error(e);}} else {STATE.challenges.push({id:nid('c'),group:t.dataset.g,text:'Nouveau défi',points:5});renderAdmin();} return; }
  if(a==='delch'){ const id=t.dataset.id; if(LIVE){try{await sb.from('challenges').delete().eq('id',id);await pull('challenges');rerender();}catch(e){console.error(e);}} else {STATE.challenges=STATE.challenges.filter(c=>c.id!==id);renderAdmin();} return; }
  if(a==='delsub'){ const id=t.dataset.id; if(LIVE){try{await sb.from('submissions').delete().eq('id',id);await pull('submissions');await pull('votes');rerender();}catch(e){console.error(e);}} else {STATE.submissions=STATE.submissions.filter(s=>s.id!==id);STATE.votes=STATE.votes.filter(v=>sub(v.submissionId));renderAdmin();} return; }
  if(a==='addgroup'){ const L=nextGroupLabel(); const ng=[...STATE.groups,L]; if(LIVE) updateConfig({groups:ng}); else {STATE.groups=ng;renderAdmin();} return; }
  if(a==='delgroup'){
    const g=t.dataset.g;
    if(STATE.groups.length<=2){toast('Il faut garder au moins 2 groupes.');return;}
    if(STATE.guests.some(x=>x.group===g)||STATE.challenges.some(c=>c.group===g)){toast('Déplace d’abord les invités et défis de ce groupe.');return;}
    const ng=STATE.groups.filter(x=>x!==g); if(LIVE) updateConfig({groups:ng}); else {STATE.groups=ng;renderAdmin();} return;
  }
});

document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.act==='cap'){
    const f=t.files&&t.files[0]; const cid=t.dataset.cid; t.value=''; closeOverlays(); if(!f) return;
    if(LIVE){
      try{ toast('Envoi de la photo…');
        const blob=await compressBlob(f);
        const path=`${STATE.currentGuest.id}/${cid}_${Date.now()}.jpg`;
        const {error:e1}=await sb.storage.from('photos').upload(path,blob,{contentType:'image/jpeg'}); if(e1) throw e1;
        const url=sb.storage.from('photos').getPublicUrl(path).data.publicUrl;
        const {error:e2}=await sb.from('submissions').insert({guest_id:STATE.currentGuest.id,challenge_id:cid,grp:STATE.currentGuest.group,photo_url:url}); if(e2) throw e2;
        await pull('submissions'); rerender();
      }catch(err){ console.error(err); toast('Échec de l’envoi 😕'); }
    }else{
      try{const blob=await compressBlob(f);const url=URL.createObjectURL(blob);
        STATE.submissions.push({id:nid('s'),guestId:STATE.currentGuest.id,challengeId:cid,group:STATE.currentGuest.group,photo:url,t:Date.now()}); render();
      }catch(_){ toast('Image illisible'); }
    }
    return;
  }
  if(t.id==='endtime'){
    const v=t.value; let ms=null;
    if(v){const [h,m]=v.split(':').map(Number);const d=new Date();d.setHours(h||0,m||0,0,0);ms=d.getTime();}
    if(LIVE) updateConfig({deadline:ms?new Date(ms).toISOString():null}); else {STATE.config.deadline=ms;renderAdmin();}
    return;
  }
  if(t.dataset.bidx){ if(LIVE) updateConfig({bonus:STATE.config.bonus}); else renderAdmin(); return; }
  if(t.dataset.field){ if(LIVE){const col=FIELD_COL[t.dataset.field]; if(col) updateConfig({[col]:t.value});} return; }
  if(t.dataset.moveguest){
    const id=t.dataset.moveguest, grp=t.value;
    if(LIVE){ await moveGuestLive(id,grp); }
    else { const gu=STATE.guests.find(x=>x.id===id); if(gu)gu.group=grp; STATE.submissions.filter(s=>s.guestId===id).forEach(s=>s.group=grp); renderAdmin(); }
    return;
  }
  if(t.dataset.cfield){
    const id=t.dataset.id, c=ch(id);
    if(c){ if(t.dataset.cfield==='points')c.points=+t.value; else if(t.dataset.cfield==='group')c.group=t.value; else c.text=t.value; }
    if(LIVE){ const col=t.dataset.cfield==='points'?'points':t.dataset.cfield==='group'?'grp':'label'; const val=t.dataset.cfield==='points'?+t.value:t.value;
      try{await sb.from('challenges').update({[col]:val}).eq('id',id);}catch(err){console.error(err);} }
    return;
  }
});

async function init(){
  if(LIVE){
    showConnecting();
    await Promise.all([pull('game_config'),pull('challenges'),pull('guests'),pull('submissions'),pull('votes')]);
    const sid=safeGet('wedding_guest');
    if(sid){const g=STATE.guests.find(x=>x.id===sid); if(g){STATE.currentGuest=g;STATE.view='app';STATE.tab='carnet';}}
    subscribe(); render();
  }else{ seed(); render(); }
}
init();
</script>
